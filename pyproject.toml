[build-system]
requires = ["maturin>=1.9,<2"]
build-backend = "maturin"

[project]
name = "neuronal-rs"
version = "0.1.0"
description = "Neural simulation in Rust, accessible from Python"
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "José Henrique Targino Dias Gois" }]
keywords = ["neuroscience", "simulation", "rust"]
classifiers = ["Development Status :: 2 - Pre-Alpha", "Programming Language :: Python :: 3", "Programming Language :: Rust", "Topic :: Scientific/Engineering"]
requires-python = ">=3.10"
dependencies = ["nicegui>=3.18,<4"]

[project.urls]
Repository = "https://github.com/ze-gois/neuronal"
Issues = "https://github.com/ze-gois/neuronal/issues"

[project.optional-dependencies]
dev = ["pytest>=8"]
plot = ["matplotlib>=3.8"]

[tool.maturin]
manifest-path = "crates/neuronal-python/Cargo.toml"
python-source = "python"
module-name = "neuronal._native"
features = ["pyo3/extension-module"]

[tool.pytest.ini_options]
testpaths = ["tests"]
